<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Kasir - Kopi Setengah Empat</title>
    <style>
        body { font-family: 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 20px; background: #f1f5f9; color: #1e293b; }
        h1 { text-align: center; color: #0284c7; margin-bottom: 30px; font-size: 24px; text-transform: uppercase; letter-spacing: 1px; }
        .grid-pesanan { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        
        /* Gaya Kotak Pesanan */
        .card-pesanan { background: white; border-radius: 16px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); border: 1px solid #e2e8f0; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; transition: all 0.2s ease; }
        .card-pesanan:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1); }
        
        .card-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px dashed #e2e8f0; padding-bottom: 10px; margin-bottom: 12px; }
        .kode-antrean { font-size: 20px; font-weight: bold; color: #0ea5e9; }
        
        /* Label Status */
        .badge-status { padding: 6px 14px; border-radius: 50px; font-size: 12px; font-weight: bold; text-transform: uppercase; }
        .status-waiting { background: #fef3c7; color: #d97706; }
        .status-dibayar { background: #e0f2fe; color: #0284c7; }
        .status-diproses { background: #d1fae5; color: #059669; }
        
        .item-menu { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 6px; color: #475569; }
        .catatan { font-size: 12px; background: #f8fafc; padding: 8px; border-radius: 8px; color: #64748b; margin-top: 8px; font-style: italic; border-left: 3px solid #cbd5e1; }
        .total-bayar { font-size: 16px; font-weight: bold; color: #1e293b; text-align: right; margin-top: 12px; border-top: 1px solid #f1f5f9; padding-top: 10px; }
        
        /* Tombol Aksi Kasir */
        .group-tombol { display: flex; gap: 8px; margin-top: 15px; }
        .btn-kasir { flex: 1; padding: 10px; border: none; border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer; transition: background 0.2s; }
        .btn-konfirmasi { background: #0ea5e9; color: white; }
        .btn-konfirmasi:hover { background: #0284c7; }
        .btn-selesai { background: #10b981; color: white; }
        .btn-selesai:hover { background: #059669; }
        .btn-arsip { background: #64748b; color: white; }
        .btn-arsip:hover { background: #475569; }
        
        #no-data { text-align: center; color: #94a3b8; margin-top: 100px; font-size: 16px; }
    </style>
</head>
<body>

    <h1>Layar Monitor Kasir - Kopi Setengah Empat</h1>
    
    <div id="no-data">Menunggu pesanan masuk dari pelanggan...</div>
    <div class="grid-pesanan" id="kontainer-pesanan"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, doc, onSnapshot, updateDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyA-w5zgpdjze0gaqVINUbM9KECN0gujqSc",
        authDomain: "kasir-customer.firebaseapp.com",
        projectId: "kasir-customer",
        storageBucket: "kasir-customer.firebasestorage.app",
        messagingSenderId: "56005368132",
        appId: "1:56005368132:web:00209c292ad7e58a6b5f11",
        measurementId: "G-CB799ZE7NG"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const kontainer = document.getElementById('kontainer-pesanan');
    const labelNoData = document.getElementById('no-data');

    // Pemantauan Real-time secara Spesifik berdasarkan Perubahan Dokumen (Doc Changes)
    const q = query(collection(db, "pesanan"), orderBy("waktuLokal", "asc"));
    
    onSnapshot(q, (snapshot) => {
        if (snapshot.empty) {
            labelNoData.style.display = "block";
        } else {
            labelNoData.style.display = "none";
        }

        snapshot.docChanges().forEach((change) => {
            const idDokumen = change.doc.id;
            const data = change.doc.data();

            if (change.type === "added") {
                renderKotakPesanan(idDokumen, data);
            } 
            
            else if (change.type === "modified") {
                // Perbarui isi kotak pesanan yang sudah ada tanpa merusak urutan grid
                const kotakLama = document.getElementById(`kotak_pesanan_${idDokumen}`);
                if (kotakLama) {
                    const statusBadge = kotakLama.querySelector('.badge-status');
                    const areaTombol = kotakLama.querySelector('.group-tombol');
                    
                    // Ganti Kelas & Teks Status Badge
                    statusBadge.innerText = data.status;
                    statusBadge.className = `badge-status ${ambilKelasStatus(data.status)}`;
                    
                    // Ganti Tombol Aksi sesuai Status Baru
                    areaTombol.innerHTML = buatStrukturTombol(idDokumen, data.status);
                }
            } 
            
            else if (change.type === "removed") {
                // SINKRONISASI UTOMATIS: Jika Customer klik batal, hapus kotaknya dari layar kasir saat ini juga
                const elemenKotak = document.getElementById(`kotak_pesanan_${idDokumen}`);
                if (elemenKotak) {
                    elemenKotak.remove();
                }
                
                // Periksa kembali jika setelah dihapus ternyata grid menjadi kosong kosong
                if (kontainer.children.length === 0) {
                    labelNoData.style.display = "block";
                }
            }
        });
    });

    // Fungsi membuat elemen HTML kotak pesanan baru
    function renderKotakPesanan(id, data) {
        // Jika kotak sudah terlanjur dirender, abaikan untuk mencegah duplikasi data
        if (document.getElementById(`kotak_pesanan_${id}`)) return;

        const card = document.createElement('div');
        card.className = "card-pesanan";
        card.id = `kotak_pesanan_${id}`; // ID ini penting agar sinkronisasi .remove() bekerja

        let daftarMenuHTML = "";
        data.daftarMenu.forEach(menu => {
            daftarMenuHTML += `<div class="item-menu"><span>${menu.nama} (x${menu.qty})</span><span>Rp ${(menu.qty * menu.harga).toLocaleString('id-ID')}</span></div>`;
        });

        let catatanHTML = data.catatan ? `<div class="catatan"><b>Catatan:</b> ${data.catatan}</div>` : "";

        card.innerHTML = `
            <div>
                <div class="card-header">
                    <span class="kode-antrean">KODE: ${data.kodeAntrean}</span>
                    <span class="badge-status ${ambilKelasStatus(data.status)}">${data.status}</span>
                </div>
                <div class="list-menu-kasir">${daftarMenuHTML}</div>
                ${catatanHTML}
            </div>
            <div>
                <div class="total-bayar">Total: Rp ${data.totalBayar.toLocaleString('id-ID')}</div>
                <div class="group-tombol">${buatStrukturTombol(id, data.status)}</div>
            </div>
        `;

        kontainer.appendChild(card);
    }

    function ambilKelasStatus(status) {
        if (status === "Menunggu Pembayaran") return "status-waiting";
        if (status === "Dibayar") return "status-dibayar";
        if (status === "Diproses") return "status-diproses";
        return "";
    }

    function buatStrukturTombol(id, status) {
        if (status === "Menunggu Pembayaran") {
            return `<button class="btn-kasir btn-konfirmasi" onclick="ubahStatusPesanan('${id}', 'Dibayar')">Konfirmasi Pembayaran</button>`;
        }
        if (status === "Dibayar") {
            return `<button class="btn-kasir btn-selesai" onclick="ubahStatusPesanan('${id}', 'Diproses')">Pesanan Selesai / Siap</button>`;
        }
        if (status === "Diproses") {
            return `<button class="btn-kasir btn-arsip" onclick="ubahStatusPesanan('${id}', 'Selesai')">Selesai Diambil (Arsip)</button>`;
        }
        return "";
    }

    // Fungsi mengubah status pesanan ke Firebase ketika kasir memproses tombol
    window.ubahStatusPesanan = async function(id, statusBaru) {
        try {
            await updateDoc(doc(db, "pesanan", id), { status: statusBaru });
        } catch (e) {
            alert("Gagal memperbarui status pesanan.");
        }
    }
</script>
</body>
</html>
