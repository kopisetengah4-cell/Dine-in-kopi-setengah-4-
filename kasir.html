<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Kasir - Kopi Setengah Empat</title>
    <style>
        /* KEMBALI KE TAMPILAN GELAP SEMULA */
        body {
            font-family: Arial, sans-serif;
            background-color: #202124;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #ffffff;
            margin-bottom: 20px;
        }
        .dashboard {
            display: flex;
            gap: 20px;
            justify-content: space-between;
        }
        .column {
            flex: 1;
            background-color: #2c2c2c;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            min-height: 500px;
        }
        .column h2 {
            text-align: center;
            border-bottom: 2px solid #444;
            padding-bottom: 10px;
            margin-top: 0;
            font-size: 18px;
        }
        
        /* Warna Header Kolom Sesuai Kode Asli Anda */
        .column:nth-child(1) h2 { color: #f2a900; } /* Pesanan Baru */
        .column:nth-child(2) h2 { color: #3498db; } /* Proses Masak */
        .column:nth-child(3) h2 { color: #2ecc71; } /* Pesanan Selesai */

        /* Gaya Kartu Pesanan Sesuai Kode Asli Anda */
        .order-card {
            background-color: #3a3a3a;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #555;
        }
        .order-header {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            margin-bottom: 8px;
            border-bottom: 1px solid #555;
            padding-bottom: 4px;
            font-size: 14px;
        }
        .order-header .kode {
            color: #f2a900;
        }
        .order-items {
            font-size: 13px;
            margin-bottom: 8px;
        }
        .order-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }
        .order-note {
            font-size: 12px;
            background-color: #4a4a4a;
            padding: 6px;
            border-radius: 4px;
            margin-top: 6px;
            color: #ccc;
            font-style: italic;
        }
        .order-total {
            font-weight: bold;
            text-align: right;
            margin-top: 8px;
            font-size: 14px;
            color: #2ecc71;
        }
        .order-actions {
            margin-top: 10px;
        }
        .btn-action {
            width: 100%;
            padding: 8px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.2s;
        }
        .btn-blue { background-color: #3498db; color: white; }
        .btn-blue:hover { background-color: #2980b9; }
        .btn-green { background-color: #2ecc71; color: white; }
        .btn-green:hover { background-color: #27ae60; }
        .btn-grey { background-color: #7f8c8d; color: white; }
        .btn-grey:hover { background-color: #95a5a6; }
    </style>
</head>
<body>

    <h1>Kopi Setengah Empat - Dashboard Kasir</h1>
    
    <div class="dashboard">
        <div class="column">
            <h2>Pesanan Baru (Menunggu Pembayaran)</h2>
            <div id="pesanan-baru-container"></div>
        </div>

        <div class="column">
            <h2>Proses Masak (Dibayar)</h2>
            <div id="proses-container"></div>
        </div>

        <div class="column">
            <h2>Pesanan Selesai (Siap Diambil)</h2>
            <div id="selesai-container"></div>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, doc, onSnapshot, updateDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyA-w5zgpdjze0gaqVINUbM9KECN0gujqSc",
        authDomain: "kasir-customer.firebaseapp.com",
        projectId: "kasir-customer",
        storageBucket: "kasir-customer.firebasestorage.app",
        messagingSenderId: "56005368132",
        appId: "1:56005368132:web:00209c292ad7e58a6b5f11",
        measurementId: "G-CB799ZE7NG"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const q = query(collection(db, "pesanan"), orderBy("waktuLokal", "asc"));
    
    // SISTEM PENGHAPUSAN REAL-TIME DENGAN DOC CHANGES
    onSnapshot(q, (snapshot) => {
        snapshot.docChanges().forEach((change) => {
            const idDokumen = change.doc.id;
            const data = change.doc.data();

            // 1. KETIKA PESANAN BARU MASUK
            if (change.type === "added") {
                renderCardPesananLama(idDokumen, data);
            } 
            
            // 2. KETIKA KASIR KLIK TOMBOL PROSES (PINDAH KOLOM)
            else if (change.type === "modified") {
                const elemenLama = document.getElementById(`kotak_pesanan_${idDokumen}`);
                if (elemenLama) elemenLama.remove();
                
                renderCardPesananLama(idDokumen, data);
            } 
            
            // 3. FITUR TOTAL SINKRONISASI: OTOMATIS HILANG JIKA DI-CANCEL DARI WEBSITE 1
            else if (change.type === "removed") {
                const elemenKotak = document.getElementById(`kotak_pesanan_${idDokumen}`);
                if (elemenKotak) {
                    elemenKotak.remove(); // Pesanan langsung lenyap dari layar monitor kasir seketika!
                }
            }
        });
    });

    // RENDER KARTU PESANAN DENGAN STYLE ASLI SEMULA
    function renderCardPesananLama(id, data) {
        if (document.getElementById(`kotak_pesanan_${id}`)) return;

        let itemsHTML = "";
        data.daftarMenu.forEach(menu => {
            itemsHTML += `
                <div class="order-item">
                    <span>${menu.nama} (x${menu.qty})</span>
                    <span>Rp ${(menu.qty * menu.harga).toLocaleString('id-ID')}</span>
                </div>`;
        });

        let catatanHTML = data.catatan ? `<div class="order-note"><b>Catatan:</b> ${data.catatan}</div>` : "";

        const card = document.createElement('div');
        card.className = "order-card";
        card.id = `kotak_pesanan_${id}`; // ID Penanda wajib fitur pembatalan otomatis

        card.innerHTML = `
            <div class="order-header">
                <span class="kode">ANTREAN: ${data.kodeAntrean}</span>
                <span style="color: #aaa; font-size: 11px;">${data.status}</span>
            </div>
            <div class="order-items">${itemsHTML}</div>
            ${catatanHTML}
            <div class="order-total">Total: Rp ${data.totalBayar.toLocaleString('id-ID')}</div>
            <div class="order-actions">
                ${buatTombolAksiLama(id, data.status)}
            </div>
        `;

        // MASUKKAN DATA KE CONTAINER KOLOM MASING-MASING
        if (data.status === "Menunggu Pembayaran") {
            document.getElementById('pesanan-baru-container').appendChild(card);
        } else if (data.status === "Dibayar") {
            document.getElementById('proses-container').appendChild(card);
        } else if (data.status === "Diproses") {
            document.getElementById('selesai-container').appendChild(card);
        }
    }

    // SUSUNAN TOMBOL AKSI ASLI SEMULA
    function buatTombolAksiLama(id, status) {
        if (status === "Menunggu Pembayaran") {
            return `<button class="btn-action btn-blue" onclick="ubahStatusKasir('${id}', 'Dibayar')">Konfirmasi Pembayaran</button>`;
        }
        if (status === "Dibayar") {
            return `<button class="btn-action btn-green" onclick="ubahStatusKasir('${id}', 'Diproses')">Pesanan Siap / Selesai</button>`;
        }
        if (status === "Diproses") {
            return `<button class="btn-action btn-grey" onclick="ubahStatusKasir('${id}', 'Selesai')">Selesai Diambil (Arsip)</button>`;
        }
        return "";
    }

    window.ubahStatusKasir = async function(id, statusBaru) {
        try {
            await updateDoc(doc(db, "pesanan", id), { status: statusBaru });
        } catch (e) {
            alert("Gagal memperbarui status transaksi.");
        }
    }
</script>
</body>
</html>
