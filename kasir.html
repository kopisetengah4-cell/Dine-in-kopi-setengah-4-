<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Kasir - Kopi Setengah Empat</title>
    <style>
        /* Menggunakan Tema Visual yang Sama dengan Website 1 */
        body { 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            margin: 0; 
            padding: 20px; 
            background: linear-gradient(135deg, #e0f2fe 0%, #f0fdf4 100%); 
            color: #334155; 
            min-height: 100vh;
        }
        
        h1 { 
            text-align: center; 
            color: #0284c7; 
            margin-bottom: 25px; 
            font-size: 22px;
            font-weight: bold;
        }

        /* Struktur Tiga Kolom Dashboard */
        .dashboard {
            display: flex;
            gap: 15px;
            justify-content: space-between;
        }
        
        .column {
            flex: 1;
            background: rgba(255, 255, 255, 0.6); 
            backdrop-filter: blur(10px);
            border: 1px solid rgba(14, 165, 233, 0.15);
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.02);
            min-height: 550px;
        }
        
        .column h2 {
            font-size: 15px;
            font-weight: bold;
            text-align: center;
            margin-top: 0;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 2px dotted #0ea5e9;
            text-transform: uppercase;
        }
        
        /* Pewarnaan Judul Kolom Kasir */
        .column:nth-child(1) h2 { color: #d97706; } /* Pesanan Baru */
        .column:nth-child(2) h2 { color: #0284c7; } /* Proses Masak */
        .column:nth-child(3) h2 { color: #059669; } /* Pesanan Selesai */

        /* Gaya Kartu Pesanan Berbentuk Bubble (Sama dengan Web 1) */
        .order-card-bubble {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 12px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.03);
        }
        
        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 13px;
        }
        
        .order-header .kode-antrean {
            color: #0284c7;
            font-size: 14px;
        }
        
        .order-header .status-badge-mini {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 50px;
            font-weight: bold;
        }
        
        /* Warna Badge Sesuai Status Web 1 */
        .bg-waiting { background: #fef3c7; color: #d97706; border: 1px solid #fde68a; }
        .bg-dibayar { background: #e0f2fe; color: #0284c7; border: 1px solid #bae6fd; }
        .bg-ready { background: #d1fae5; color: #059669; border: 1px solid #a7f3d0; }

        .order-items {
            font-size: 12.5px;
            color: #475569;
            margin-bottom: 6px;
        }
        
        .order-item-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 3px;
        }
        
        /* Kotak Catatan Sesuai Rincian Bubble Web 1 */
        .order-note-bubble {
            font-size: 11px;
            background: #f8fafc;
            padding: 6px 10px;
            border-radius: 10px;
            margin-top: 6px;
            color: #64748b;
            font-style: italic;
            border: 1px solid #e2e8f0;
        }
        
        .order-total-price {
            font-weight: bold;
            text-align: right;
            margin-top: 8px;
            font-size: 13.5px;
            color: #10b981;
            padding-top: 6px;
            border-top: 1px dashed #e2e8f0;
        }
        
        .order-actions {
            margin-top: 10px;
        }
        
        /* Tombol Bubble Khas Website 1 */
        .btn-submit-bubble {
            width: 100%;
            padding: 8px;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            transition: transform 0.1s;
        }
        .btn-submit-bubble:active {
            transform: scale(0.98);
        }
        
        /* Variasi Warna Tombol Sesuai Alur */
        .btn-orange { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }
        .btn-blue { background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%); }
        .btn-green { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }
    </style>
</head>
<body>

    <h1>Kopi Setengah Empat - Dashboard Monitoring Kasir</h1>
    
    <div class="dashboard">
        <div class="column">
            <h2>Pesanan Baru</h2>
            <div id="pesanan-baru-container"></div>
        </div>

        <div class="column">
            <h2>Proses Masak</h2>
            <div id="proses-container"></div>
        </div>

        <div class="column">
            <h2>Pesanan Selesai</h2>
            <div id="selesai-container"></div>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, doc, onSnapshot, updateDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyA-w5zgpdjze0gaqVINUbM9KECN0gujqSc",
        authDomain: "kasir-customer.firebaseapp.com",
        projectId: "kasir-customer",
        storageBucket: "kasir-customer.firebasestorage.app",
        messagingSenderId: "56005368132",
        appId: "1:56005368132:web:00209c292ad7e58a6b5f11",
        measurementId: "G-CB799ZE7NG"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const q = query(collection(db, "pesanan"), orderBy("waktuLokal", "asc"));
    
    // LOGIKA UTAMA SINKRONISASI PEMBATALAN REAL-TIME
    onSnapshot(q, (snapshot) => {
        snapshot.docChanges().forEach((change) => {
            const idDokumen = change.doc.id;
            const data = change.doc.data();

            // 1. DATA BARU MASUK
            if (change.type === "added") {
                renderCardPesananKasir(idDokumen, data);
            } 
            
            // 2. DATA DIUBAH STATUS OLEH KASIR (PINDAH CONTAINER)
            else if (change.type === "modified") {
                const elemenLama = document.getElementById(`kotak_pesanan_${idDokumen}`);
                if (elemenLama) elemenLama.remove();
                
                renderCardPesananKasir(idDokumen, data);
            } 
            
            // 3. DATA DIHAPUS OLEH CUSTOMER (SINKRONISASI WEB 1)
            else if (change.type === "removed") {
                const elemenKotak = document.getElementById(`kotak_pesanan_${idDokumen}`);
                if (elemenKotak) {
                    elemenKotak.remove(); // Pesanan langsung lenyap dari layar kasir tanpa refresh!
                }
            }
        });
    });

    // FUNGSI RENDER DENGAN STYLE THEME WEBSITE 1
    function renderCardPesananKasir(id, data) {
        if (document.getElementById(`kotak_pesanan_${id}`)) return;

        let itemsHTML = "";
        data.daftarMenu.forEach(menu => {
            itemsHTML += `
                <div class="order-item-row">
                    <span>${menu.nama} (x${menu.qty})</span>
                    <span>Rp ${(menu.qty * menu.harga).toLocaleString('id-ID')}</span>
                </div>`;
        });

        let catatanHTML = data.catatan ? `<div class="order-note-bubble"><b>Catatan:</b> ${data.catatan}</div>` : "";

        const card = document.createElement('div');
        card.className = "order-card-bubble";
        card.id = `kotak_pesanan_${id}`; // ID penanda wajib untuk fungsi .remove()

        card.innerHTML = `
            <div class="order-header">
                <span class="kode-antrean">KODE: ${data.kodeAntrean}</span>
                <span class="status-badge-mini ${ambilKelasBadge(data.status)}">${data.status}</span>
            </div>
            <div class="order-items">${itemsHTML}</div>
            ${catatanHTML}
            <div class="order-total-price">Total: Rp ${data.totalBayar.toLocaleString('id-ID')}</div>
            <div class="order-actions">
                ${buatTombolAksi(id, data.status)}
            </div>
        `;

        // MEMBAGI KARTU PESANAN KE MASING-MASING WADAH CONTAINER
        if (data.status === "Menunggu Pembayaran") {
            document.getElementById('pesanan-baru-container').appendChild(card);
        } else if (data.status === "Dibayar") {
            document.getElementById('proses-container').appendChild(card);
        } else if (data.status === "Diproses") {
            document.getElementById('selesai-container').appendChild(card);
        }
    }

    function ambilKelasBadge(status) {
        if (status === "Menunggu Pembayaran") return "bg-waiting";
        if (status === "Dibayar") return "bg-dibayar";
        if (status === "Diproses") return "bg-ready";
        return "";
    }

    function buatTombolAksi(id, status) {
        if (status === "Menunggu Pembayaran") {
            return `<button class="btn-submit-bubble btn-orange" onclick="updateStatusKasir('${id}', 'Dibayar')">Konfirmasi Pembayaran</button>`;
        }
        if (status === "Dibayar") {
            return `<button class="btn-submit-bubble btn-blue" onclick="updateStatusKasir('${id}', 'Diproses')">Pesanan Siap / Selesai</button>`;
        }
        if (status === "Diproses") {
            return `<button class="btn-submit-bubble btn-green" onclick="updateStatusKasir('${id}', 'Selesai')">Selesai Diambil (Arsip)</button>`;
        }
        return "";
    }

    window.updateStatusKasir = async function(id, statusBaru) {
        try {
            await updateDoc(doc(db, "pesanan", id), { status: statusBaru });
        } catch (e) {
            alert("Gagal merubah status pesanan.");
        }
    }
</script>
</body>
</html>
